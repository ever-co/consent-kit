name: CI

on:
  push:
    branches: [develop, stage, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build & test
    # Self-hosted ARC pool when the org variable is available; forks fall back
    # to a GitHub-hosted runner so external contributions can still run CI.
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run verify

      - name: package tarball contents
        run: npm pack --dry-run

  react-compat:
    name: react ${{ matrix.react }}
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        react: ['18.2.0', '18.3.1', '19.0.0', 'latest']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      # React is a peer dependency spanning ^18.2 || ^19 — prove it, do not assume it.
      - run: npm install --no-save react@${{ matrix.react }} react-dom@${{ matrix.react }}
      - run: npx vitest run test/react.test.tsx
